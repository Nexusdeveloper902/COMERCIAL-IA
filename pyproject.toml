[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-ai-data"
version = "0.1.0"
description = "COMERCIAL-IA: electronics product data collection, normalization & validation (ML-ready base)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "COMERCIAL-IA Team" }]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
derived = ["pyarrow>=15.0", "pandas>=2.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
commercial-ai-pipeline = "commercial_ai.pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
