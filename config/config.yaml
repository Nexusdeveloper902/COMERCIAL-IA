# COMERCIAL-IA data pipeline configuration
project:
  name: commercial-ai-data
  schema_version: "1.0"

paths:
  data_dir: data
  raw_dir: data/raw
  normalized_dir: data/normalized
  rejected_dir: data/rejected
  taxonomy_dir: data/taxonomy
  derived_dir: data/derived
  interactions_dir: data/interactions
  sample_dir: data/sample
  logs_dir: logs

currency:
  default: COP
  allowed: [COP, USD, EUR]

# FX conversion: fetch real USD->COP rates, keep original price AND add price_cop.
# Free no-key API (open.er-api.com); cached with TTL; static fallback if offline.
fx:
  rates_url: "https://open.er-api.com/v6/latest/USD"
  fallback_usd_cop: 4100.0   # used only if the API is down and no cache exists
  ttl_seconds: 86400         # refresh rates once per day

scraping:
  respect_robots: true
  rate_limit_seconds: 1.0
  max_retries: 4
  backoff_base_seconds: 1.5
  cache_dir: data/.http_cache
  user_agent: "commercial-ai-bot/0.1 (+contact: data-team@example.com)"

pipeline:
  state_file: data/.pipeline_state.json
  sources:
    - synthetic   # deterministic generator; no key needed; tagged source_kind="synthetic"
    # - sample      # offline fixtures (source_kind="sample")
    # - bestbuy     # real Best Buy API (pass --api-key or set BBY_API_KEY)
    # - mercadolibre # real ML API (site MCO; may 403 from datacenter IPs)

# Best Buy Products API (https://developer.bestbuy.com).
# Prefer the --api-key CLI flag or BBY_API_KEY env var; only put the key here
# for local dev, never commit it. NOTE: Best Buy rejects free-email domains
# (Gmail/Yahoo/Outlook) at signup — use a non-free address to register.
bestbuy:
  api_key: null

# Mercado Libre public API (https://developers.mercadolibre.com).
# Read-only search needs no token, but ML blocks datacenter IPs (403 PolicyAgent).
# Register an app and set ML_ACCESS_TOKEN to use authenticated requests.
mercadolibre:
  site: MCO

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"
